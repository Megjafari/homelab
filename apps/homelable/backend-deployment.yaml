apiVersion: apps/v1
kind: Deployment
metadata:
  name: homelable-backend
  namespace: homelable
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: homelable-backend
  template:
    metadata:
      labels:
        app: homelable-backend
    spec:
      containers:
      - name: backend
        image: ghcr.io/pouzor/homelable-backend:latest@sha256:c7521966683e96a974996168c29af19c4f5d936f48f029c3980ecf11c364d3ce
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 512Mi
        startupProbe:
          tcpSocket:
            port: 8000
          periodSeconds: 10
          failureThreshold: 30
        readinessProbe:
          tcpSocket:
            port: 8000
          periodSeconds: 10
          failureThreshold: 3
        livenessProbe:
          tcpSocket:
            port: 8000
          periodSeconds: 20
          failureThreshold: 6
        env:
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: homelable-credentials
              key: SECRET_KEY
        - name: AUTH_USERNAME
          valueFrom:
            secretKeyRef:
              name: homelable-credentials
              key: AUTH_USERNAME
        - name: AUTH_PASSWORD_HASH
          valueFrom:
            secretKeyRef:
              name: homelable-credentials
              key: AUTH_PASSWORD_HASH
        - name: SCANNER_RANGES
          value: '["192.168.1.0/24"]'
        ports:
        - containerPort: 8000
        volumeMounts:
        - name: data
          mountPath: /app/data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: homelable-backend-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: homelable
spec:
  selector:
    app: homelable-backend
  ports:
  - port: 8000
    targetPort: 8000